[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gcut"
version = "0.1.0"
description = "Turn G-code into Cricut-style cut paths (machine-independent)"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
gcut = "gcut.cli:main"

[tool.setuptools]
packages = ["gcut"]
